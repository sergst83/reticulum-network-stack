# You should probably edit it to include any additional,
# interfaces and settings you might need.

# Only the most basic options are included in this default
# configuration. To see a more verbose, and much longer,
# configuration example, you can run the command:
# rnsd --exampleconfig

reticulum:

  # If you enable Transport, your system will route traffic
  # for other peers, pass announces and serve path requests.
  # This should only be done for systems that are suited to
  # act as transport nodes, ie. if they are stationary and
  # always-on. This directive is optional and can be removed
  # for brevity.

  enable_transport: false

  # By default, the first program to launch the Reticulum
  # Network Stack will create a shared instance, that other
  # programs can communicate with. Only the shared instance
  # opens all the configured interfaces directly, and other
  # local programs communicate with the shared instance over
  # a local socket. This is completely transparent to the
  # user, and should generally be turned on. This directive
  # is optional and can be removed for brevity.

  share_instance: false

  # If you want to run multiple *different* shared instances
  # on the same system, you will need to specify different
  # shared instance ports for each. The defaults are given
  # below, and again, these options can be left out if you
  # don't need them.

  shared_instance_port: 37428
  instance_control_port: 37429

  # You can configure Reticulum to panic and forcibly close
  # if an unrecoverable interface error occurs, such as the
  # hardware device for an interface disappearing. This is
  # an optional directive, and can be left out for brevity.
  # This behaviour is disabled by default.

  panic_on_interface_error: false

  # Links negotiate an MTU larger than the 500-byte default when the
  # next-hop interface supports it. This significantly increases
  # throughput over fast links. Enabled by default.

  # link_mtu_discovery: true

  # Reticulum can look for other interfaces announced on the network.
  # This is off by default. Enabling it only makes this instance
  # *listen* for announced interfaces; connecting to them additionally
  # requires autoconnect_discovered_interfaces below.

  # discover_interfaces: false

  # Minimum proof-of-work stamp value a discovered interface must carry
  # to be remembered. Leave unset for the default.

  # required_discovery_value: 16

  # How many discovered interfaces this instance may automatically
  # connect to. Zero, or leaving this out, disables auto-connection
  # entirely — this instance will not dial out to interfaces it finds
  # on the network unless you set this.

  # autoconnect_discovered_interfaces: 0

  # Interface mode assigned to auto-connected interfaces. Defaults to
  # gateway mode when transport is enabled, otherwise unset.

  # autoconnect_interface_mode: gateway

  # Only accept interface discoveries announced by these identities.

  # interface_discovery_sources:
  #   - 00000000000000000000000000000000

  # Name distinguishing this instance if you run several on one system.

  # instance_name: default

  # Default announce rate controls applied to interfaces that do not
  # configure their own.

  # default_ar_target: 3600
  # default_ar_penalty: 0
  # default_ar_grace: 5


# The interfaces section defines the physical and virtual
# interfaces Reticulum will use to communicate on. This
# section will contain examples for a variety of interface
# types. You can modify these or use them as a basis for
# your own config, or simply remove the unused ones.

interfaces:

  # This interface enables communication with other
  # link-local Reticulum nodes over UDP. It does not
  # need any functional IP infrastructure like routers
  # or DHCP servers, but will require that at least link-
  # local IPv6 is enabled in your operating system, which
  # should be enabled by default in almost any OS. See
  # the Reticulum Manual for more configuration options.

  "Default Interface":
    type: AutoInterface
    enabled: true
