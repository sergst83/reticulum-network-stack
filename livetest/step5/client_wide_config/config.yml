# Step 5c initiator at 1 Gbps: advertises 524288, the top of the optimise_mtu
# table, which the responder must clamp back to its own 16384.
reticulum:
  enable_transport: false
  share_instance: false
  panic_on_interface_error: false
interfaces:
  "Default Interface":
    type: AutoInterface
    enabled: false
  "Step5 TCP Client":
    type: TCPClientInterface
    enabled: true
    target_host: 127.0.0.1
    target_port: 42504
    bitrate: 1000000000
