# Java node acting as the TCP listener for step 4b, so the Python requester
# can connect in.
reticulum:
  enable_transport: false
  share_instance: false
  panic_on_interface_error: false
interfaces:
  "Default Interface":
    type: AutoInterface
    enabled: false
  "Step4 TCP Server":
    type: TCPServerInterface
    enabled: true
    listen_ip: 127.0.0.1
    listen_port: 42503
